<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse all technical articles and security insights by Vishal Chaudhary.">
    <title>Articles | Vishal Chaudhary</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <style>
        :root {
            color-scheme: dark;
            --bg-canvas: #0a0a0c;
            --bg-surface: rgba(28, 28, 30, 0.82);
            --accent: #2997ff;
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --border: rgba(255, 255, 255, 0.12);
        }
        [data-theme="light"] {
            color-scheme: light;
            --bg-canvas: #f5f5f7;
            --bg-surface: #fff;
            --accent: #0071e3;
            --text-primary: #1d1d1f;
            --text-secondary: #68686d;
            --border: rgba(0, 0, 0, 0.12);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg-canvas);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            line-height: 1.6;
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px max(24px, calc((100% - 1000px) / 2));
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(18px);
        }
        .topbar a, .theme-toggle { color: var(--text-primary); text-decoration: none; }
        .back-link, .theme-toggle { display: inline-flex; align-items: center; gap: 8px; }
        .theme-toggle {
            padding: 7px 12px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 999px;
            cursor: pointer;
        }
        main { max-width: 1000px; margin: 0 auto; padding: 64px 24px 96px; }
        h1 { margin: 0 0 8px; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.15; }
        .intro, .article-count, .status { color: var(--text-secondary); }
        .intro { margin: 0 0 28px; font-size: 1.05rem; }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        .archive-tools { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
        .search {
            width: 100%;
            max-width: 520px;
            padding: 12px 16px;
            color: var(--text-primary);
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            font: inherit;
        }
        .search:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
        .article-count { margin: 0; white-space: nowrap; }
        .article-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 20px; }
        .article-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 210px;
            padding: 26px;
            color: inherit;
            text-decoration: none;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .article-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        .article-tag { color: var(--accent); font-size: 0.78rem; font-weight: 600; text-transform: uppercase; }
        .article-card h2 { margin: 10px 0; font-size: 1.2rem; line-height: 1.35; }
        .article-card p { margin: 0; color: var(--text-secondary); }
        .article-date { margin-top: 20px; padding-top: 14px; color: var(--text-secondary); font-size: 0.9rem; border-top: 1px solid var(--border); }
        .status { grid-column: 1 / -1; }
        @media (max-width: 600px) {
            .topbar { padding: 12px 16px; }
            main { padding: 42px 20px 72px; }
            .archive-tools { align-items: stretch; flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="back-link" href="index.html#blog"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span> Portfolio</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme">
            <span class="material-symbols-outlined" id="theme-icon" aria-hidden="true">dark_mode</span>
            <span id="theme-label">Dark</span>
        </button>
    </header>
    <main>
        <h1>Articles & Insights</h1>
        <p class="intro">Browse practical notes on security, governance, compliance, and architecture.</p>
        <div class="archive-tools">
            <label class="sr-only" for="article-search">Search articles</label>
            <input class="search" id="article-search" type="search" placeholder="Search by title, topic, or summary">
            <p class="article-count" id="article-count" aria-live="polite"></p>
        </div>
        <div class="article-list" id="article-list" aria-live="polite">
            <p class="status">Loading articles...</p>
        </div>
    </main>
    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeLabel = document.getElementById('theme-label');
        const savedTheme = localStorage.getItem('portfolio-theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
            document.documentElement.dataset.theme = savedTheme;
        }

        function updateThemeControl() {
            const isDark = document.documentElement.dataset.theme === 'dark';
            themeIcon.textContent = isDark ? 'dark_mode' : 'light_mode';
            themeLabel.textContent = isDark ? 'Dark' : 'Light';
        }

        updateThemeControl();
        themeToggle.addEventListener('click', () => {
            const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = nextTheme;
            localStorage.setItem('portfolio-theme', nextTheme);
            updateThemeControl();
        });

        const list = document.getElementById('article-list');
        const search = document.getElementById('article-search');
        const count = document.getElementById('article-count');
        let articles = [];

        function renderArticles() {
            const query = search.value.trim().toLowerCase();
            const matches = articles.filter(article =>
                [article.title, article.tag, article.summary].some(value =>
                    String(value).toLowerCase().includes(query)
                )
            );
            count.textContent = `${matches.length} ${matches.length === 1 ? 'article' : 'articles'}`;

            if (matches.length === 0) {
                const empty = document.createElement('p');
                empty.className = 'status';
                empty.textContent = query ? 'No articles match your search.' : 'No articles have been published yet.';
                list.replaceChildren(empty);
                return;
            }

            const cards = matches.map(article => {
                const link = document.createElement('a');
                link.className = 'article-card';
                link.href = `post.html?slug=${encodeURIComponent(article.slug)}`;

                const content = document.createElement('div');
                const tag = document.createElement('span');
                tag.className = 'article-tag';
                tag.textContent = article.tag;
                const title = document.createElement('h2');
                title.textContent = article.title;
                const summary = document.createElement('p');
                summary.textContent = article.summary;
                content.append(tag, title, summary);

                const date = document.createElement('div');
                date.className = 'article-date';
                date.textContent = article.date;
                link.append(content, date);
                return link;
            });
            list.replaceChildren(...cards);
        }

        search.addEventListener('input', renderArticles);
        fetch('Post/posts.json')
            .then(response => {
                if (!response.ok) throw new Error('Unable to load article catalog.');
                return response.json();
            })
            .then(posts => {
                if (!Array.isArray(posts)) throw new Error('The article catalog has an invalid format.');
                articles = posts;
                renderArticles();
            })
            .catch(error => {
                console.error(error);
                count.textContent = '';
                const message = document.createElement('p');
                message.className = 'status';
                message.textContent = 'Articles are temporarily unavailable. Please try again later.';
                list.replaceChildren(message);
            });
    </script>
</body>
</html>
