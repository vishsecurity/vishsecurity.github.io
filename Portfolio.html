<section id="resume" tabindex="0" aria-label="Resume section" style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  <!-- Existing Resume content here -->

  <div class="resume-section" style="margin-top: 40px;">
    <h3 tabindex="0" class="collapsible" style="font-size: 2rem; font-weight: 700; color: #222; margin-bottom: 20px; border-bottom: 3px solid #0073b1; padding-bottom: 10px; cursor: pointer; user-select: none;">
      Blogs
      <span class="collapse-indicator" style="float:right; font-weight: 700; font-size: 1.5rem; transition: transform 0.3s ease;">▼</span>
    </h3>
    <div class="content" style="max-width: 900px; margin: 0 auto;">

      <!-- Existing Blog List -->
      <ul id="blog-list" aria-label="Blog posts" style="list-style:none; padding-left:0; margin-bottom: 30px; display: flex; flex-direction: column; gap: 25px;">
        <li class="blog-card" tabindex="0">
          <h4 class="blog-title" tabindex="0">Design Conferences in 2022 <span>Design Fab 23, 2022</span></h4>
          <div class="blog-content" aria-hidden="true">
            <p>Veritatis et quasi architecto beatae vitae dicta sunt, explicabo.</p>
          </div>
        </li>
        <!-- ... (your other existing blog items) ... -->
      </ul>

      <!-- Blog Publishing Form -->
      <section id="publish-blog" tabindex="0" aria-label="Blog publishing section" class="publish-blog-section">
        <h4 class="section-title">Publish a New Blog Post</h4>
        <form id="blog-publish-form" aria-describedby="blog-publish-desc" class="blog-form">
          <p id="blog-publish-desc" class="form-desc">Fill in the details below and click Publish to add a new blog post.</p>

          <label for="blog-title-input" class="form-label">Blog Title</label>
          <input type="text" id="blog-title-input" name="blog-title" required placeholder="Enter blog post title" class="form-input" />

          <label for="blog-date-input" class="form-label">Publish Date</label>
          <input type="date" id="blog-date-input" name="blog-date" required class="form-input" />

          <label for="blog-content-input" class="form-label">Blog Content</label>
          <textarea id="blog-content-input" name="blog-content" rows="5" required placeholder="Write your blog content here..." class="form-textarea"></textarea>

          <button type="submit" class="btn-primary">Publish</button>
        </form>
      </section>
    </div>
  </div>
</section>

<style>
  /* Blog cards */
  #blog-list .blog-card {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    padding: 25px 30px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    outline-offset: 4px;
  }
  #blog-list .blog-card:hover,
  #blog-list .blog-card:focus-visible {
    transform: translateY(-6px);
    box-shadow: 0 12px 30px rgba(0, 115, 177, 0.3);
  }

  .blog-title {
    font-size: 1.6rem;
    font-weight: 700;
    color: #0073b1;
    margin-bottom: 10px;
  }
  .blog-title span {
    font-weight: 400;
    font-size: 1rem;
    color: #777;
    margin-left: 10px;
  }
  .blog-content p {
    font-size: 1.1rem;
    line-height: 1.6;
    color: #444;
  }

  /* Buttons for edit/delete */
  .blog-card div:last-child {
    margin-top: 15px;
  }
  .edit-btn,
  .delete-btn {
    padding: 8px 14px;
    font-size: 0.9rem;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    transition: background-color 0.25s ease;
    color: white;
  }
  .edit-btn {
    background-color: #f0ad4e;
  }
  .edit-btn:hover,
  .edit-btn:focus-visible {
    background-color: #d9951f;
    outline: none;
  }
  .delete-btn {
    background-color: #d9534f;
  }
  .delete-btn:hover,
  .delete-btn:focus-visible {
    background-color: #b02a28;
    outline: none;
  }

  /* Publish blog section styling */
  .publish-blog-section {
    background-color: #0073b1;
    padding: 30px 25px;
    border-radius: 12px;
    color: white;
    box-shadow: 0 8px 25px rgba(0, 115, 177, 0.35);
  }
  .publish-blog-section .section-title {
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 20px;
  }
  .form-desc {
    margin-bottom: 25px;
    font-weight: 500;
  }

  /* Form styles */
  .blog-form {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .form-label {
    font-weight: 600;
    margin-bottom: 6px;
    font-size: 1rem;
  }
  .form-input,
  .form-textarea {
    padding: 12px 16px;
    font-size: 1.1rem;
    border-radius: 8px;
    border: none;
    outline: none;
    transition: box-shadow 0.25s ease;
  }
  .form-input:focus,
  .form-textarea:focus {
    box-shadow: 0 0 8px 3px rgba(0, 115, 177, 0.6);
  }
  .form-textarea {
    resize: vertical;
  }

  /* Publish button */
  .btn-primary {
    margin-top: 10px;
    background-color: #ffdd57;
    color: #003d66;
    font-weight: 700;
    font-size: 1.2rem;
    padding: 14px 0;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(255, 221, 87, 0.7);
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  .btn-primary:hover,
  .btn-primary:focus-visible {
    background-color: #ffd633;
    color: #001f33;
    outline: none;
  }

  /* Collapsible Header Styling */
  .collapsible {
    user-select: none;
  }
  .collapsible.active .collapse-indicator {
    transform: rotate(180deg);
  }
</style>

<script>
  // Collapsible behavior for resume blogs section
  const collapsibleHeader = document.querySelector('.collapsible');
  const collapsibleContent = collapsibleHeader.nextElementSibling;
  const collapseIndicator = collapsibleHeader.querySelector('.collapse-indicator');

  collapsibleHeader.addEventListener('click', () => {
    collapsibleHeader.classList.toggle('active');
    if (collapsibleHeader.classList.contains('active')) {
      collapsibleContent.style.maxHeight = collapsibleContent.scrollHeight + 'px';
      collapseIndicator.style.transform = 'rotate(180deg)';
    } else {
      collapsibleContent.style.maxHeight = null;
      collapseIndicator.style.transform = 'rotate(0deg)';
    }
  });

  // Blog publishing functionality
  const form = document.getElementById('blog-publish-form');
  const blogList = document.getElementById('blog-list');

  function createBlogItem(title, date, content) {
    const li = document.createElement('li');
    li.className = 'blog-card';
    li.setAttribute('tabindex', '0');

    const formattedDate = new Date(date).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });

    li.innerHTML = `
      <h4 class="blog-title" tabindex="0">${title} <span>${formattedDate}</span></h4>
      <div class="blog-content" aria-hidden="true">
        <p>${content}</p>
      </div>
      <div>
        <button class="edit-btn" aria-label="Edit blog post">Edit</button>
        <button class="delete-btn" aria-label="Delete blog post">Delete</button>
      </div>
    `;

    // Edit functionality
    li.querySelector('.edit-btn').addEventListener('click', () => {
      const titleElem = li.querySelector('.blog-title');
      const contentElem = li.querySelector('.blog-content p');
      const currentTitle = titleElem.childNodes[0].textContent.trim();
      const currentDateText = titleElem.querySelector('span').textContent.trim();
      const currentContent = contentElem.textContent;

      form['blog-title'].value = currentTitle;

      // parse the date from display format to ISO
      const parsedDate = new Date(currentDateText);
      const isoDate = parsedDate.toISOString().split('T')[0];
      form['blog-date'].value = isoDate;

      form['blog-content'].value = currentContent;

      // Remove the blog post while editing
      li.remove();

      // Focus on the title input for convenience
      form['blog-title'].focus();
    });

    // Delete functionality
    li.querySelector('.delete-btn').addEventListener('click', () => {
      if (confirm('Are you sure you want to delete this blog post?')) {
        li.remove();
      }
    });

    return li;
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const title = form['blog-title'].value.trim();
    const date = form['blog-date'].value;
    const content = form['blog-content'].value.trim();

    if (!title || !date || !content) {
      alert('Please fill out all fields.');
      return;
    }

    const newBlogItem = createBlogItem(title, date, content);
    blogList.prepend(newBlogItem);

    form.reset();
  });

  // Optional: initialize collapsible open or closed
  // collapsibleHeader.click(); // uncomment to open by default

</script>
