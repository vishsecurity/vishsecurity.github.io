<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Vishal Chaudhary</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root {
            --bg-canvas: #000000;
            --bg-surface: #1c1c1e;
            --text-main: #f5f5f7;
            --text-sub: #86868b;
            --border-color: #333336;
            --accent-blue: #2997ff;
            --nav-bg: rgba(0, 0, 0, 0.8);
        }

        [data-theme="light"] {
            --bg-canvas: #f5f5f7;
            --bg-surface: #ffffff;
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --border-color: #d2d2d7;
            --nav-bg: rgba(245, 245, 247, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-canvas); color: var(--text-main); line-height: 1.7; }
        .container { max-width: 760px; margin: 0 auto; padding: 120px 20px 60px; }
        
        nav { position: fixed; top: 0; width: 100%; background: var(--nav-bg); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-color); z-index: 1000; }
        .nav-content { max-width: 980px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; height: 52px; padding: 0 20px; }
        .logo { font-weight: 600; color: var(--text-main); text-decoration: none; }
        .nav-links { display: flex; gap: 20px; list-style: none; align-items: center; }
        .nav-links a { color: var(--text-sub); text-decoration: none; font-size: 0.85rem; }

        .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent-blue); text-decoration: none; margin-bottom: 24px; font-weight: 500; }
        .article-header { border-bottom: 1px solid var(--border-color); padding-bottom: 32px; margin-bottom: 32px; }
        .article-header h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 12px; }
        .meta { color: var(--text-sub); font-size: 0.9rem; }

        .article-body h2 { font-size: 1.4rem; margin: 32px 0 16px; color: var(--text-main); }
        .article-body p { margin-bottom: 16px; color: var(--text-main); }
        .article-body ul, .article-body ol { margin-bottom: 24px; padding-left: 20px; color: var(--text-sub); }
        .article-body li { margin-bottom: 8px; }
        .article-body hr { border: none; border-top: 1px solid var(--border-color); margin: 32px 0; }
        
        .author-box { margin-top: 48px; padding: 24px; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 12px; }
        .theme-toggle { background: none; border: none; color: var(--text-main); cursor: pointer; display: flex; align-items: center; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-content">
            <a href="/" class="logo">Vishal Chaudhary</a>
            <ul class="nav-links">
                <li><a href="/blogs/">Blogs</a></li>
                <li><a href="/#contact">Contact</a></li>
                <li>
                    <button class="theme-toggle" id="theme-toggle-btn" aria-label="Toggle theme">
                        <span class="material-symbols-outlined" id="theme-icon">light_mode</span>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <a href="/blogs/" class="back-link">
            <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span> Back to Blogs
        </a>
        
        <header class="article-header">
            <h1>{{ page.title }}</h1>
            <div class="meta">Published on {{ page.date | date: "%B %d, %Y" }} • {{ page.read_time }}</div>
        </header>

        <main class="article-body">
            {{ content }}
        </main>

        <div class="author-box">
            <strong>Author: {{ page.author | default: "Vishal Chaudhary" }}</strong>
            <p style="font-size: 0.85rem; color: var(--text-sub); margin-top: 4px;">Technical GRC | Security Architecture | IT Audit</p>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('theme-toggle-btn');
        const themeIcon = document.getElementById('theme-icon');
        toggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                themeIcon.textContent = 'dark_mode';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeIcon.textContent = 'light_mode';
            }
        });
    </script>
</body>
</html>
